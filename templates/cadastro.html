{% extends 'layout.html' %}

{% block content %}

<h2 class="mb-4">

    Cadastro de Aluno

</h2>

<form method="POST"
      enctype="multipart/form-data">

    <div class="row">

        <div class="col-md-6">

            <label>Nome</label>

            <input
                type="text"
                name="nome"
                class="form-control"
                required>

        </div>

        <div class="col-md-6">

            <label>Matrícula</label>

            <input
                type="text"
                name="matricula"
                class="form-control"
                required>

        </div>

    </div>

    <div class="row mt-3">

        <div class="col-md-6">

            <label>Turma</label>

            <input
                type="text"
                name="turma"
                class="form-control"
                required>

        </div>

        <div class="col-md-6">

            <label>E-mail</label>

            <input
                type="email"
                name="email"
                class="form-control">

        </div>

    </div>

    <div class="mt-3">

        <label>Telefone</label>

        <input
            type="text"
            name="telefone"
            class="form-control">

    </div>

    <div class="mt-3">

        <label>Foto</label>

        <input
            type="file"
            name="foto"
            class="form-control"
            accept="image/*"
            required>

    </div>

    <button class="btn btn-primary mt-4">

        Salvar Aluno

    </button>

</form>

{% endblock %}
